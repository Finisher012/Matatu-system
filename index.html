<!DOCTYPE html>
<html>
<head>
    <title>SafariLink Matatu Ticket Booking System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h1>SafariLink Matatu Ticket Booking System</h1>

    <p>Welcome to our SafariLink online Booking System.Your travel is our concern</p>

    <form action="process.php" method="POST" onsubmit="return validateForm();">

        <label>Passenger Name</label>
        <input type="text" id="name" name="name">

        <label>Phone Number</label>
        <input type="text" id="phone" name="phone">

        <label>Email</label>
        <input type="email" name="email">

        <label>Route</label>
        <select name="route" id="route">
            <option value="">Select Route</option>
            <option value="Nairobi-Nyeri">Nairobi-Nyeri</option>
            <option value="Mombasa-Nanyuki">Mombasa-Nanyuki</option>
            <option value="Nakuru-Embu">Nakuru-Embu</option>
            <option value="Kisumu-Nairobi">Kisumu-Nairobi</option>
        </select>

        <label>Number of Seats</label>
        <input type="number" id="seats" name="seats">

        <label>Travel Date</label>
        <input type="date" name="date">

        <input type="submit" value="Book Ticket">
        <input type="reset" value="Reset">

    </form>
</div>

<script src="js/script.js"></script>

</body>
</html>
